<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>STM32 Notes</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      background-color: #f9f9f9;
      color: #333;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    h1, h2, h3 {
      color: #2c3e50;
      margin-top: 40px;
    }

    h1 {
      padding-bottom: 10px;
    }

    pre {
      background-color: #f4f4f4;
      padding: 15px;
      border-left: 4px solid #007acc;
      overflow-x: auto;
      border-radius: 5px;
    }

    code {
      background-color: #eee;
      padding: 2px 4px;
      border-radius: 3px;
      font-family: monospace;
    }

    a {
      color: #007acc;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    ul {
      margin-left: 20px;
    }

    hr {
      border: 0;
      height: 1px;
      background: #ddd;
      margin: 40px 0;
    }

    .note {
      background-color: #eaf6ff;
      border-left: 5px solid #007acc;
      padding: 15px 20px;
      margin: 20px 0;
      border-radius: 4px;
    }
    
    h1 {
      color: #007acc; /* Blue color for title */
      padding-bottom: 10px;
    }
  </style>
</head>
<body>

<h1>STM32 Notes</h1>

In the Nucleo development board, the RESET button is the black one, the user button is the blue one.
<p/>

</ul>


</body>
</html>
