<!DOCTYPE html>

<meta charset="UTF-8">
<title>N8N notes</title>

<style>
    /* Global page style */
    body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 40px;
        background: #f7f7f7;
        color: #222;
        line-height: 1.6;
    }

    /* Link styling */
    a {
        color: #0066cc;
        text-decoration: none;
        font-weight: bold;
    }
    a:hover {
        text-decoration: underline;
        color: #004999;
    }

    /* Reset counters */
    body {
        counter-reset: h1counter;
    }

    /* H1 numbering */
    h1 {
        counter-reset: h2counter;
        counter-increment: h1counter;
        margin-left: 0;
        padding-left: 0;
    }
    h1::before {
        content: counter(h1counter) ". ";
        font-weight: bold;
        color: #444;
    }

    /* H2 numbering */
    h2 {
        counter-reset: h3counter;
        counter-increment: h2counter;
        margin-left: 20px;
        padding-left: 0;
    }
    h2::before {
        content: counter(h1counter) "." counter(h2counter) " ";
        font-weight: bold;
        color: #555;
    }

    /* H3 numbering */
    h3 {
        counter-increment: h3counter;
        margin-left: 40px;
        padding-left: 0;
    }
    h3::before {
        content: counter(h1counter) "." counter(h2counter) "." counter(h3counter) " ";
        font-weight: bold;
        color: #666;
    }
</style>

</head>
